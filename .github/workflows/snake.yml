name: 🐍 Generate contribution snake

# Regenerates the contribution snake animation for the profile README.
# Output is published to the "output" branch, which README.md references:
#   https://raw.githubusercontent.com/muffinnnx/muffinnnx/output/github-contribution-snake-dark.svg
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * *" # refresh daily at midnight UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-snake-light.svg?palette=github-light&color_snake=#8b5cf6
            dist/github-contribution-snake-dark.svg?palette=github-dark&color_snake=#8b5cf6

      - name: Publish to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
          force_orphan: true
